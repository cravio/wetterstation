// Shairport-sync config for the wetterstation Pi Zero 2 W.
// Deployed to /etc/shairport-sync.conf by setup_airplay.sh.
general = {
  name = "wohnzimmer airplay";
  output_backend = "alsa";
  interpolation = "soxr";
};

alsa = {
  // Virtual device: duplicates to USB-DAC + loopback (see asound.conf).
  // No mixer_control_name: USB DACs rarely expose one consistently,
  // shairport falls back to software volume.
  output_device = "airplay_out";
};

sessioncontrol = {
  // Flag file drives the wetterstation spectrum visualizer.
  // "active" hooks (not play_begins/ends) + timeout debounce track gaps.
  run_this_when_active_begins = "/usr/local/bin/airplay-active.sh on";
  run_this_when_active_ends = "/usr/local/bin/airplay-active.sh off";
  active_state_timeout = 10.0;
};
