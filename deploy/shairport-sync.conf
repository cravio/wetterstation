// Shairport-sync config for the wetterstation Pi Zero 2 W.
// Deployed to /etc/shairport-sync.conf by setup_airplay.sh.
general = {
  name = "wohnzimmer airplay";
  output_backend = "alsa";
  interpolation = "soxr";
};

alsa = {
  // Virtual device: duplicates to USB-DAC + loopback (see asound.conf).
  // No mixer_control_name: USB DACs rarely expose one consistently,
  // shairport falls back to software volume.
  output_device = "airplay_out";
};

sessioncontrol = {
  // Flag file drives the wetterstation spectrum visualizer.
  // active-state hooks (not play_begins/ends) + timeout debounce track gaps.
  run_this_before_entering_active_state = "/usr/local/bin/airplay-active.sh on";
  run_this_after_exiting_active_state = "/usr/local/bin/airplay-active.sh off";
  active_state_timeout = 10.0;
};

diagnostics = {
  // Keep this at 0 in production. At verbosity 2 shairport-sync logs a
  // per-period "alsa: underrun" line while streaming — measured at ~83
  // lines/second, which floods the journal and evicts everything else
  // within minutes. Raise it deliberately (and briefly) when debugging
  // the audio path, then set it back.
  log_verbosity = 0;
};
