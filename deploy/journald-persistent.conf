# Persistent journal for the wetterstation Pi.
# Deployed to /etc/systemd/journald.conf.d/50-persistent.conf by setup_airplay.sh
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf,
# which forces Storage=volatile. Drop-ins override the main journald.conf, so
# setting Storage=persistent in /etc/systemd/journald.conf alone has NO effect —
# it needs a drop-in that sorts after 40-*.
#
# Without this the journal lives in /run and every reboot erases it, which makes
# post-mortem debugging of crashes impossible (see README, Absturzdiagnose).
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
