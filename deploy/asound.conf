# ALSA config for wetterstation AirPlay visualizer.
# Deployed to /etc/asound.conf by setup_airplay.sh, which replaces
# @DAC_CARD@ with the detected USB-DAC card name (see `aplay -l`).
#
# Audio path:
#   shairport-sync -> airplay_out (plug) -> multi_out
#     -> slave a: USB-DAC (hearable)
#     -> slave b: Loopback playback (hw:Loopback,0,0)
#   wetterstation captures the mirror: hw:Loopback,1,0

pcm.dac {
    type hw
    card "@DAC_CARD@"
}

pcm.multi_out {
    type multi
    slaves.a { pcm "dac"             channels 2 }
    slaves.b { pcm "hw:Loopback,0,0" channels 2 }
    bindings.0 { slave a; channel 0 }
    bindings.1 { slave a; channel 1 }
    bindings.2 { slave b; channel 0 }
    bindings.3 { slave b; channel 1 }
}

pcm.airplay_out {
    type plug
    slave.pcm "multi_out"
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}

ctl.airplay_out {
    type hw
    card "@DAC_CARD@"
}
