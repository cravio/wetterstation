# Systemd drop-in for shairport-sync.
# Deployed to /etc/systemd/system/shairport-sync.service.d/wetterstation.conf
#
# RuntimeDirectory: /run/shairport-sync is created on start and removed
# on stop/crash — the visualizer flag file can never go stale.
[Service]
RuntimeDirectory=shairport-sync
RuntimeDirectoryPreserve=no
